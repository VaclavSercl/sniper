[package]
name = "sovereign-cortex"
version = "20.1.0"
edition = "2024"

[[bin]]
name = "sovereign-cortex"
path = "src/main.rs"

[dependencies]
sniper-shared = { path = "../../shared" }
candle-brain = { path = "../../candle-brain" }
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tungstenite = { version = "0.26", features = ["native-tls"] }
ureq = "3"
reqwest = { version = "0.13.2", features = ["json"] }
tokio-tungstenite = { version = "0.29.0", features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
arrayvec = "0.7.6"
bytes = "1.11.1"
futures-util = "0.3.32"
libc = "0.2"
