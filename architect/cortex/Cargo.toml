[package]
name = "sovereign-cortex"
version = "13.0.0"
edition = "2024"

[[bin]]
name = "sovereign-cortex"
path = "src/main.rs"

[dependencies]
sniper-shared = { path = "../../shared" }
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking"] }
tungstenite = { version = "0.26", features = ["native-tls"] }
ureq = "3"
