[package]
name = "hydra"
version = "20.1.0"
edition = "2024"

[[bin]]
name = "hydra-core"
path = "src/main.rs"

[[bin]]
name = "hydra-dashboard"
path = "src/dashboard.rs"

[[bin]]
name = "hydra-config"
path = "src/config_cli.rs"

[[bin]]
name = "hydra-brain"
path = "src/brain.rs"

[dependencies]
sniper-shared = { path = "../shared", features = ["runtime"] }
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
simd-json = "0.14.3"
itoa = "1.0.18"
ryu = "1.0.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }

axum = { version = "0.8.1", features = ["ws"] }
tower-http = { version = "0.6.2", features = ["cors", "fs"] }
tokio = { version = "1.50.0", features = ["full"] }
futures-util = "0.3.31"
crc32fast = "1.4.2"
bytes = "1.11.1"
rand = "0.9.0"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
dotenvy = "0.15.7"
memmap2 = "0.9.5"
zerocopy = { version = "0.8.14", features = ["derive"] }
sysinfo = "0.33.1"
tokio-stream = "0.1.18"
feed-rs = "2.3.1"
rusqlite = { version = "0.33", features = ["bundled"] }
thiserror = "2.0"
anyhow = "1.0"
core_affinity = "0.8.3"
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
signal-hook = "0.3"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4.3"
tracing-appender = "0.2"
fastwebsockets = { version = "0.8", features = ["upgrade", "hyper", "simd"] }
hyper = "1.0"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
smallvec = "1.15.1"
arrayvec = "0.7.6"
