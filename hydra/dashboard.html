<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👁️ Sovereign Panopticon v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: rgba(20, 20, 25, 0.95);
            --border: rgba(50, 50, 60, 0.5);
            --text: #e0e0e0;
            --green: #00ff88;
            --red: #ff3366;
            --accent: #00c3ff;
            --muted: #888;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #151a25 0%, #0a0a0a 100%);
            color: var(--text);
            padding: 24px;
            margin: 0;
            min-height: 100vh;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .header h2 { margin: 0; font-size: 1.5rem; letter-spacing: 0.1em; text-transform: uppercase; }
        .header-stats { display: flex; gap: 24px; font-size: 1.1rem; }
        .pos { color: var(--green); }
        .neg { color: var(--red); }

        /* Fleet View */
        #fleet-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }
        .bot-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .bot-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--border); transition: 0.2s;
        }
        .bot-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0, 195, 255, 0.1); }
        .bot-card:hover::before { background: var(--accent); }
        
        .bot-card .name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .bot-card .name { font-weight: 700; font-size: 1.2rem; }
        .status { font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
        .status.live { background: rgba(0, 255, 136, 0.15); color: var(--green); border: 1px solid rgba(0, 255, 136, 0.3); }
        .status.paper { background: rgba(0, 195, 255, 0.15); color: var(--accent); border: 1px solid rgba(0, 195, 255, 0.3); }
        .status.paused { background: rgba(255, 51, 102, 0.15); color: var(--red); border: 1px solid rgba(255, 51, 102, 0.3); }
        
        .bot-metrics { display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; }
        .metric { display: flex; justify-content: space-between; }
        .metric-lbl { color: var(--muted); }

        /* Tactical View */
        #tactical-view { display: none; }
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
            padding: 8px 16px; cursor: pointer; border-radius: 6px; margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; transition: 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); border-color: #555; }
        
        .tactical-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .tactical-header h3 { margin: 0; color: var(--accent); font-size: 1.8rem; }
        
        .canvas-container {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 24px; display: flex; justify-content: center; align-items: center;
        }
        #tactical-canvas { display: block; max-width: 100%; height: auto; }
        
    </style>
</head>
<body>

<div class="header">
    <div>
        <h2>👁️ PANOPTICON v2.0</h2>
    </div>
    <div class="header-stats mono">
        <div>Equity: <span id="tot-eq" style="color: #fff">---</span></div>
        <div>Armada PnL: <span id="arm-pnl">---</span></div>
        <div style="margin-left: 20px">WS: <span id="ws-status" style="color:var(--red)">OFFLINE</span></div>
    </div>
</div>

<div style="display: flex; gap: 24px; padding-bottom: 20px; font-size: 0.85rem; color: var(--muted);" class="mono">
    <div>🖥️ CPU LOAD: <span id="hw-cpu" style="color: #fff">--</span></div>
    <div>💾 RAM: <span id="hw-ram" style="color: #fff">--%</span></div>
    <div>🔥 GPU: <span id="hw-gpu-util" style="color: #fff">--%</span> <span style="color: var(--muted)">|</span> <span id="hw-gpu" style="color: #fff">--°C</span></div>
    <div>🎮 VRAM: <span id="hw-vram" style="color: #fff">-- MB</span></div>
    <div>💽 SYS: <span id="hw-disk-root" style="color: #fff">--%</span></div>
    <div>⚡ SHM: <span id="hw-disk-shm" style="color: #fff">--%</span></div>
</div>

<div id="fleet-view"></div>

<div id="tactical-view">
    <button class="back-btn" onclick="showFleetView()">← FLEET OVERVIEW</button>
    <div class="tactical-header">
        <h3 id="tactical-title">Bot Detail</h3>
        <span id="tactical-status" class="status"></span>
    </div>
    <div class="canvas-container">
        <canvas id="tactical-canvas" width="800" height="400"></canvas>
    </div>
</div>

<script>
    const fleetView = document.getElementById('fleet-view');
    const tacticalView = document.getElementById('tactical-view');
    const canvas = document.getElementById('tactical-canvas');
    const ctx = canvas.getContext('2d');
    
    let currentBot = null;
    let lastData = null;

    function formatUsd(val) {
        return (val >= 0 ? '+$' : '-$') + Math.abs(val).toFixed(2);
    }
    
    function showFleetView() {
        currentBot = null;
        fleetView.style.display = 'grid';
        tacticalView.style.display = 'none';
        if (lastData) renderFleet(lastData);
    }
    
    function showBotView(botName) {
        currentBot = botName;
        fleetView.style.display = 'none';
        tacticalView.style.display = 'block';
        if (lastData) renderTactical(lastData);
    }

    function renderFleet(data) {
        document.getElementById('tot-eq').textContent = `$${data.total_equity.toFixed(2)}`;
        const pnl = document.getElementById('arm-pnl');
        pnl.textContent = formatUsd(data.armada_pnl);
        pnl.className = data.armada_pnl >= 0 ? 'pos' : 'neg';

        let cards = fleetView.children;
        if (cards.length === 0) {
            let html = '';
            data.bots.forEach(b => {
                const statusCls = b.mode.toLowerCase();
                const pnlCls = b.pnl >= 0 ? 'pos' : 'neg';
                html += `
                    <div class="bot-card" id="card-${b.name}" data-bot-name="${b.name}">
                        <div class="name-row">
                            <div class="name">${b.name}</div>
                            <div id="status-${b.name}" class="status ${statusCls}">${b.mode}</div>
                        </div>
                        <div class="bot-metrics mono">
                            <div class="metric"><span class="metric-lbl">PnL:</span><span id="pnl-${b.name}" class="${pnlCls}">${formatUsd(b.pnl)}</span></div>
                            <div class="metric"><span class="metric-lbl">Position:</span><span id="pos-${b.name}" style="color:#fff">${b.position.toFixed(4)}</span></div>
                            <div class="metric"><span class="metric-lbl">Kelly:</span><span id="kelly-${b.name}" style="color:var(--accent)">$${b.kelly_limit.toFixed(0)}</span></div>
                        </div>
                    </div>
                `;
            });
            fleetView.innerHTML = html;
        } else {
            // Update without DOM thrashing
            data.bots.forEach(b => {
                const statusEl = document.getElementById(`status-${b.name}`);
                if (statusEl) {
                    statusEl.textContent = b.mode;
                    statusEl.className = `status ${b.mode.toLowerCase()}`;
                }
                const pnlEl = document.getElementById(`pnl-${b.name}`);
                if (pnlEl) {
                    pnlEl.textContent = formatUsd(b.pnl);
                    pnlEl.className = b.pnl >= 0 ? 'pos' : 'neg';
                }
                const posEl = document.getElementById(`pos-${b.name}`);
                if (posEl) posEl.textContent = b.position.toFixed(4);
                
                const kellyEl = document.getElementById(`kelly-${b.name}`);
                if (kellyEl) kellyEl.textContent = `$${b.kelly_limit.toFixed(0)}`;
            });
        }
    }

    function renderTactical(data) {
        const bot = data.bots.find(b => b.name === currentBot);
        if (!bot) return;
        
        document.getElementById('tactical-title').textContent = bot.name;
        const statEl = document.getElementById('tactical-status');
        statEl.textContent = bot.mode;
        statEl.className = `status ${bot.mode.toLowerCase()}`;
        
        // Draw using Canvas API
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (bot.name === 'Hydra') renderHydra(ctx, bot.detail);
        else if (bot.name === 'Moonshot') renderMoonshot(ctx, bot.detail);
        else if (bot.name === 'Grid') renderGrid(ctx, bot.detail);
        else if (bot.name === 'Trigon') renderTrigon(ctx, bot.detail);
        else if (bot.name === 'Nexus') renderNexus(ctx, bot.detail);
    }

    function renderHydra(ctx, det) {
        const W = canvas.width, H = canvas.height;
        const cx = W/2, cy = H - 80, r = 180;
        
        // Background track
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI, 0);
        ctx.lineWidth = 24;
        ctx.strokeStyle = '#222';
        ctx.stroke();
        
        let obi = det.obi; // -1 to 1
        let val = (obi + 1) / 2; 
        let angle = Math.PI + val * Math.PI;
        
        // Value Arc
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI, angle);
        ctx.strokeStyle = obi >= 0 ? '#00ff88' : '#ff3366';
        ctx.stroke();
        
        // Info text
        ctx.fillStyle = '#fff';
        ctx.font = '700 32px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText(`OBI: ${obi.toFixed(3)}`, cx, cy - 40);
        
        ctx.font = '14px Inter';
        ctx.fillStyle = '#888';
        ctx.fillText('ORDER BOOK IMBALANCE', cx, cy - 10);
        
        // Draw grid levels snippet
        ctx.font = '12px JetBrains Mono';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#00c3ff';
        ctx.fillText('Grid Levels:', 20, 30);
        det.grid_levels.forEach((lvl, i) => {
            ctx.fillStyle = lvl.side === 'buy' ? '#00ff88' : '#ff3366';
            ctx.fillText(`${lvl.side.toUpperCase()} @ $${lvl.price.toFixed(2)} [${lvl.qty}]`, 20, 50 + i*20);
        });
    }

    function renderMoonshot(ctx, det) {
        const W = canvas.width, H = canvas.height;
        const cols = 5, rows = 4;
        const gap = 15;
        const w = (W - (cols+1)*gap) / cols;
        const h = (H - (rows+1)*gap) / rows;
        
        det.pairs.forEach((p, i) => {
            const row = Math.floor(i / cols);
            const col = i % cols;
            const x = gap + col * (w + gap);
            const y = gap + row * (h + gap);
            
            // Box
            if (p.status === 'active') {
                ctx.fillStyle = p.pnl >= 0 ? 'rgba(0, 255, 136, 0.2)' : 'rgba(255, 51, 102, 0.2)';
                ctx.strokeStyle = p.pnl >= 0 ? '#00ff88' : '#ff3366';
            } else {
                ctx.fillStyle = '#1a1a20';
                ctx.strokeStyle = '#333';
            }
            ctx.fillRect(x, y, w, h);
            ctx.strokeRect(x, y, w, h);
            
            // Text
            ctx.fillStyle = p.status === 'active' ? '#fff' : '#666';
            ctx.font = '600 14px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(`PAIR ${p.id}`, x + w/2, y + h/2 - 5);
            
            ctx.font = '12px JetBrains Mono';
            ctx.fillStyle = p.status === 'active' ? (p.pnl >= 0 ? '#00ff88' : '#ff3366') : '#555';
            ctx.fillText(formatUsd(p.pnl), x + w/2, y + h/2 + 15);
        });
    }

    function renderGrid(ctx, det) {
        const W = canvas.width, H = canvas.height;
        const cx = W/2;
        ctx.font = '14px JetBrains Mono';
        ctx.textAlign = 'center';
        
        // Center line
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx - 200, H/2); ctx.lineTo(cx + 200, H/2); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillText('MID PRICE', cx, H/2 - 5);
        
        const rowH = 35;
        // Asks (above mid) - displayed going up
        det.sell_levels.forEach((lvl, i) => {
            const y = H/2 - 30 - i*rowH;
            ctx.fillStyle = '#ff3366';
            ctx.globalAlpha = 0.2;
            ctx.fillRect(cx - 150, y-15, 300, 20);
            ctx.globalAlpha = 1;
            ctx.fillText(`ASK $${lvl.toFixed(2)}`, cx, y);
        });
        // Bids (below mid) - displayed going down
        det.buy_levels.forEach((lvl, i) => {
            const y = H/2 + 30 + i*rowH;
            ctx.fillStyle = '#00ff88';
            ctx.globalAlpha = 0.2;
            ctx.fillRect(cx - 150, y-15, 300, 20);
            ctx.globalAlpha = 1;
            ctx.fillText(`BID $${lvl.toFixed(2)}`, cx, y);
        });
    }

    function renderTrigon(ctx, det) {
        const W = canvas.width, H = canvas.height;
        const cols = 6, rows = 4;
        const gap = 12;
        const w = (W - (cols+1)*gap) / cols;
        const h = (H - (rows+1)*gap) / rows;
        
        det.triangles.forEach((t, i) => {
            const row = Math.floor(i / cols);
            const col = i % cols;
            const x = gap + col * (w + gap);
            const y = gap + row * (h + gap);
            
            // Calculate color intensity based on profit bps
            let intensity = Math.min(Math.abs(t.profit_bps) / 30, 1) * 0.8 + 0.2;
            if (t.profit_bps > 0) {
                ctx.fillStyle = `rgba(0, 255, 136, ${intensity})`;
                ctx.strokeStyle = '#00ff88';
            } else {
                ctx.fillStyle = `rgba(255, 51, 102, ${intensity})`;
                ctx.strokeStyle = '#ff3366';
            }
            
            ctx.fillRect(x, y, w, h);
            ctx.strokeRect(x, y, w, h);
            
            ctx.fillStyle = '#fff';
            ctx.font = '600 13px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(`TRI-${t.id}`, x + w/2, y + h/2 - 5);
            ctx.font = '12px JetBrains Mono';
            ctx.fillText(`${t.profit_bps.toFixed(2)} bps`, x + w/2, y + h/2 + 15);
        });
    }

    function renderNexus(ctx, det) {
        const W = canvas.width, H = canvas.height;
        const cx = W/2, cy = H/2;
        
        ctx.fillStyle = '#fff';
        ctx.font = '18px JetBrains Mono';
        ctx.textAlign = 'center';
        
        // Bitfinex price line
        ctx.strokeStyle = '#00c3ff';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(100, cy - 40); ctx.lineTo(W-100, cy - 40); ctx.stroke();
        ctx.fillStyle = '#00c3ff';
        ctx.fillText(`Bitfinex Mid: $${det.bfx_mid.toFixed(2)}`, cx, cy - 55);
        
        // Binance price line
        ctx.strokeStyle = '#f5b041';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(100, cy + 40); ctx.lineTo(W-100, cy + 40); ctx.stroke();
        ctx.fillStyle = '#f5b041';
        ctx.fillText(`Binance Mid: $${det.bnb_mid.toFixed(2)}`, cx, cy + 70);
        
        // Spread logic
        ctx.fillStyle = '#00ff88';
        ctx.font = '700 24px Inter';
        ctx.fillText(`SPREAD: $${det.spread.toFixed(2)}`, cx, cy + 8);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(cx, cy - 40); ctx.lineTo(cx, cy + 40); ctx.stroke();
        ctx.setLineDash([]);
    }

    // Connect WebSocket
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    
    ws.onopen = () => {
        const st = document.getElementById('ws-status');
        st.textContent = 'ONLINE'; 
        st.style.color = 'var(--green)';
    };
    
    ws.onclose = () => {
        const st = document.getElementById('ws-status');
        st.textContent = 'OFFLINE'; 
        st.style.color = 'var(--red)';
    };
    
    ws.onmessage = (e) => {
        lastData = JSON.parse(e.data);
        
        if (lastData.hardware) {
            document.getElementById('hw-cpu').textContent = lastData.hardware.cpu_load;
            document.getElementById('hw-ram').textContent = lastData.hardware.ram_pct.toFixed(1) + '%';
            
            const gpuEl = document.getElementById('hw-gpu');
            gpuEl.textContent = lastData.hardware.gpu_temp + '°C';
            gpuEl.style.color = lastData.hardware.gpu_temp >= 75 ? 'var(--red)' : 'var(--green)';
            
            document.getElementById('hw-gpu-util').textContent = lastData.hardware.gpu_load + '%';
            document.getElementById('hw-vram').textContent = lastData.hardware.vram_mb + ' MB';
            document.getElementById('hw-disk-root').textContent = lastData.hardware.disk_root_pct.toFixed(0) + '%';
            document.getElementById('hw-disk-shm').textContent = lastData.hardware.disk_shm_pct.toFixed(0) + '%';
        }

        if (currentBot) renderTactical(lastData);
        else renderFleet(lastData);
    };

    // Event Delegation for Fleet View clicks
    fleetView.addEventListener('click', (e) => {
        const card = e.target.closest('.bot-card');
        if (!card) return;
        const botName = card.dataset.botName;
        if (botName) showBotView(botName);
    });

</script>
</body>
</html>
