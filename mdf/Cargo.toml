[package]
name = "mdf"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "mdf-feed"
path = "src/main.rs"

[dependencies]
sniper-shared = { path = "../shared" }
serde_json = "1.0.149"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
tokio = { version = "1.50.0", features = ["full"] }
futures-util = "0.3.31"
dotenvy = "0.15.7"
memmap2 = "0.9.5"
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
anyhow = "1.0"
