<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Panopticon 👁️</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0e17; color: #e1e5ee; }
        .gauge-meter { transition: width 0.3s ease-in-out; }
    </style>
</head>
<body class="p-8 font-sans">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [data, setData] = useState(null);
            const [status, setStatus] = useState('Connecting...');

            useEffect(() => {
                const ws = new WebSocket('ws://localhost:8080/ws/panopticon');
                ws.onopen = () => setStatus('Connected');
                ws.onmessage = (e) => setData(JSON.parse(e.data));
                ws.onerror = () => setStatus('Error');
                ws.onclose = () => setStatus('Disconnected');
                return () => ws.close();
            }, []);

            if (!data) return <div>{status}</div>;

            const oracle = data.oracle || { ranging: 0, trending: 0 };
            const armada = data.armada || { hydra: 0, moonshot: 0, grid: 0, trigon: 0, nexus: 0 };
            const hydra = data.hydra_l0 || { inventory_skew: 0, realized_pnl: 0 };

            const totalCap = Object.values(armada).reduce((a, b) => a + b, 0);

            return (
                <div class="max-w-4xl mx-auto space-y-6">
                    <h1 class="text-3xl font-bold mb-8 text-purple-400">👁️ Panopticon Dashboard</h1>
                    
                    <div class="grid grid-cols-2 gap-6 w-full">
                        <div class="bg-gray-900 p-6 rounded-lg border border-gray-800">
                            <h2 class="text-sm font-bold text-gray-400 mb-4 uppercase">Trending Score</h2>
                            <div class="w-full bg-gray-800 rounded-full h-4 mb-2 overflow-hidden">
                                <div class="bg-blue-500 h-4 gauge-meter" style={{width: `${Math.min(100, Math.max(0, oracle.trending * 100))}%`}}></div>
                            </div>
                            <div class="text-xl font-mono">{oracle.trending.toFixed(2)}</div>
                        </div>

                        <div class="bg-gray-900 p-6 rounded-lg border border-gray-800">
                            <h2 class="text-sm font-bold text-gray-400 mb-4 uppercase">Ranging Score</h2>
                            <div class="w-full bg-gray-800 rounded-full h-4 mb-2 overflow-hidden">
                                <div class="bg-yellow-500 h-4 gauge-meter" style={{width: `${Math.min(100, Math.max(0, oracle.ranging * 100))}%`}}></div>
                            </div>
                            <div class="text-xl font-mono">{oracle.ranging.toFixed(2)}</div>
                        </div>
                    </div>

                    <div class="bg-gray-900 p-6 rounded-lg border border-gray-800">
                        <h2 class="text-lg font-bold text-gray-300 mb-6">Mempool Allocation (USD)</h2>
                        <div class="space-y-4 font-mono text-sm">
                            {Object.entries(armada).map(([bot, cap]) => {
                                const pct = totalCap ? (cap / totalCap) * 100 : 0;
                                return (
                                    <div key={bot} className="flex items-center">
                                        <div className="w-24 uppercase font-bold text-gray-400">{bot}</div>
                                        <div className="flex-1 bg-gray-800 h-4 mx-4 rounded overflow-hidden">
                                            <div className="bg-purple-500 h-4 gauge-meter" style={{width: `${pct}%`}}></div>
                                        </div>
                                        <div className="w-24 text-right">${cap.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div class="bg-gray-900 p-6 rounded-lg border border-gray-800">
                        <h2 class="text-lg font-bold text-gray-300 mb-6">Hydra L0 Real-Time</h2>
                        <div class="grid grid-cols-2 gap-4 font-mono text-sm">
                            <div>
                                <div class="text-gray-500 uppercase text-xs mb-1">Inventory Skew</div>
                                <div class="text-xl">{hydra.inventory_skew}</div>
                            </div>
                            <div>
                                <div class="text-gray-500 uppercase text-xs mb-1">Realized PnL</div>
                                <div class={`text-xl ${hydra.realized_pnl >= 0 ? 'text-green-500' : 'text-red-500'}`}>${hydra.realized_pnl.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-900 p-6 rounded-lg border border-gray-800">
                        <h2 class="text-lg font-bold text-gray-300 mb-6 font-mono text-fuchsia-400">🩸 PAPER PERFORMANCE (Virtual PnL)</h2>
                        <div class="grid grid-cols-5 gap-4 font-mono text-sm text-center">
                            <div>
                                <div class="text-gray-500 uppercase text-xs mb-1">HYDRA</div>
                                <div class={`text-xl font-bold ${hydra.virtual_pnl >= 0 ? 'text-green-400' : 'text-red-400'}`}>${(hydra.virtual_pnl || 0).toFixed(2)}</div>
                            </div>
                            <div>
                                <div class="text-gray-500 uppercase text-xs mb-1">GRID</div>
                                <div class={`text-xl font-bold ${hydra.grid_virtual_pnl >= 0 ? 'text-green-400' : 'text-red-400'}`}>${(hydra.grid_virtual_pnl || 0).toFixed(2)}</div>
                            </div>
                            <div>
                                <div class="text-gray-500 uppercase text-xs mb-1">MOONSHOT</div>
                                <div class={`text-xl font-bold ${hydra.moonshot_virtual_pnl >= 0 ? 'text-green-400' : 'text-red-400'}`}>${(hydra.moonshot_virtual_pnl || 0).toFixed(2)}</div>
                            </div>
                            <div>
                                <div class="text-gray-500 uppercase text-xs mb-1">TRIGON</div>
                                <div class={`text-xl font-bold ${hydra.trigon_virtual_pnl >= 0 ? 'text-green-400' : 'text-red-400'}`}>${(hydra.trigon_virtual_pnl || 0).toFixed(2)}</div>
                            </div>
                            <div>
                                <div class="text-gray-500 uppercase text-xs mb-1">NEXUS</div>
                                <div class={`text-xl font-bold ${hydra.nexus_virtual_pnl >= 0 ? 'text-green-400' : 'text-red-400'}`}>${(hydra.nexus_virtual_pnl || 0).toFixed(2)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
