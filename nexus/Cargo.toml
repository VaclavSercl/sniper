[package]
name = "nexus"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "nexus-core"
path = "src/main.rs"

[[bin]]
name = "nexus-config"
path = "src/config_cli.rs"

[dependencies]
sniper-shared = { path = "../shared", features = ["runtime"] }
chrono = "0.4.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
itoa = "1.0.18"
ryu = "1.0.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
reqwest = { version = "0.12.12", features = ["json"] }
tokio = { version = "1.50.0", features = ["full"] }
futures-util = "0.3.31"
bytes = "1.11.1"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
dotenvy = "0.15.7"
memmap2 = "0.9.5"
rusqlite = { version = "0.33", features = ["bundled"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4.3"
fastwebsockets = { version = "0.8", features = ["upgrade", "hyper", "simd"] }
hyper = "1.0"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
simd-json = "0.14.3"
