<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📐 Grid — Dynamic Multi-Level Grid Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; padding: 16px; }
        h1 { color: #60a5fa; font-size: 1.4em; margin-bottom: 8px; }
        .status-bar { display: flex; gap: 24px; padding: 8px 12px; background: #111128; border-radius: 8px; margin-bottom: 12px; font-size: 0.85em; }
        .status-bar .item { display: flex; gap: 6px; align-items: center; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
        .badge-live { background: #1a472a; color: #4ade80; }
        .badge-paused { background: #4a1a1a; color: #f87171; }
        .grid-container { display: flex; gap: 16px; }
        .grid-side { flex: 1; }
        .grid-side h2 { font-size: 1em; margin-bottom: 6px; }
        .grid-side.buy h2 { color: #4ade80; }
        .grid-side.sell h2 { color: #f87171; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
        th { background: #1a1a2e; color: #818cf8; padding: 5px 8px; text-align: left; border-bottom: 2px solid #2d2d5e; }
        td { padding: 4px 8px; border-bottom: 1px solid #1a1a2e; }
        .buy-price { color: #4ade80; font-weight: bold; }
        .sell-price { color: #f87171; font-weight: bold; }
        .filled { background: #1a2e1a !important; }
        .pnl-pos { color: #4ade80; }
        .pnl-neg { color: #f87171; }
        .footer { margin-top: 12px; font-size: 0.7em; color: #555; text-align: center; }
    </style>
</head>
<body>
    <h1>📐 Grid — Dynamic Multi-Level BTC-USD</h1>
    <div class="status-bar">
        <div class="item">Status: <span id="badge" class="badge badge-paused">LOADING</span></div>
        <div class="item">Mid: <span id="mid">$0</span></div>
        <div class="item">Spacing: $<span id="spacing">0</span></div>
        <div class="item">PnL: <span id="pnl">$0.00</span></div>
        <div class="item">Daily: <span id="daily">$0.00</span></div>
        <div class="item">Fills: <span id="fills">0</span></div>
    </div>
    <div class="grid-container">
        <div class="grid-side buy"><h2>📥 BUY Levels</h2><table><thead><tr><th>#</th><th>Price</th><th>Status</th></tr></thead><tbody id="buy-body"><tr><td colspan="3">—</td></tr></tbody></table></div>
        <div class="grid-side sell"><h2>📤 SELL Levels</h2><table><thead><tr><th>#</th><th>Price</th><th>Status</th></tr></thead><tbody id="sell-body"><tr><td colspan="3">—</td></tr></tbody></table></div>
    </div>
    <div class="footer">Sniper Armada · Grid v1.0.0 · SSE :3002</div>
    <script>
        const es = new EventSource('/events');
        es.onmessage = function(e) {
            const d = JSON.parse(e.data);
            document.getElementById('badge').textContent = d.paused ? 'PAUSED' : 'LIVE';
            document.getElementById('badge').className = 'badge ' + (d.paused ? 'badge-paused' : 'badge-live');
            document.getElementById('mid').textContent = '$' + d.mid_price;
            document.getElementById('spacing').textContent = d.spacing;
            document.getElementById('fills').textContent = d.fills;
            const pnl = parseFloat(d.pnl), daily = parseFloat(d.daily_pnl);
            const pe = document.getElementById('pnl'); pe.textContent = '$' + d.pnl; pe.className = pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
            const de = document.getElementById('daily'); de.textContent = '$' + d.daily_pnl; de.className = daily >= 0 ? 'pnl-pos' : 'pnl-neg';
            let bh = ''; for (const l of d.buy_levels) bh += `<tr class="${l.filled?'filled':''}"><td>${l.level}</td><td class="buy-price">$${l.price}</td><td>${l.filled?'✅ FILLED':'⏳ Open'}</td></tr>`;
            document.getElementById('buy-body').innerHTML = bh || '<tr><td colspan="3">No levels</td></tr>';
            let sh = ''; for (const l of d.sell_levels) sh += `<tr class="${l.filled?'filled':''}"><td>${l.level}</td><td class="sell-price">$${l.price}</td><td>${l.filled?'✅ FILLED':'⏳ Open'}</td></tr>`;
            document.getElementById('sell-body').innerHTML = sh || '<tr><td colspan="3">No levels</td></tr>';
        };
    </script>
</body>
</html>
