[package]
name = "sniper-shared"
version = "12.0.0"
edition = "2024"

[lib]
name = "sniper_types"
path = "src/lib.rs"

[features]
default = []
runtime = ["dep:tokio", "dep:reqwest", "dep:serde_json", "dep:fs2", "dep:anyhow", "dep:dotenvy", "dep:tokio-tungstenite", "dep:fastwebsockets", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:native-tls", "dep:tokio-native-tls", "dep:futures-util"]

[dependencies]
memmap2 = "0.9.5"
zerocopy = { version = "0.8.14", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
tracing-appender = "0.2"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
arrayvec = "0.7"
bytes = "1.10.0"

tokio = { version = "1.50.0", features = ["sync", "rt", "macros", "time", "signal"], optional = true }
reqwest = { version = "0.12.12", features = ["json"], optional = true }
serde_json = { version = "1.0.149", optional = true }
fs2 = { version = "0.4.3", optional = true }
anyhow = { version = "1.0", optional = true }
dotenvy = { version = "0.15.7", optional = true }
tokio-tungstenite = { version = "0.26", features = ["native-tls"], optional = true }
fastwebsockets = { version = "0.8", features = ["upgrade", "hyper", "simd"], optional = true }
hyper = { version = "1.0", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"], optional = true }
native-tls = { version = "0.2.18", optional = true }
tokio-native-tls = { version = "0.3.1", optional = true }
futures-util = { version = "0.3.31", optional = true }

[[bin]]
name = "dump_l2_offsets"
path = "src/bin/dump_l2_offsets.rs"
required-features = ["runtime"]
