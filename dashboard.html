<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beroun Sniper Dashboard 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.31/dist/uPlot.min.css">
    <script src="https://unpkg.com/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
    <style>
        .glow { box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
        .anomaly { color: #ef4444; font-weight: bold; animation: pulse 1s infinite; }
        .positive { color: #22c55e; }
        .negative { color: #ef4444; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .uplot { background: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-white font-mono p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="border-b border-slate-700 pb-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-green-400 tracking-tighter uppercase">Beroun Sniper <span class="text-slate-500 text-sm font-normal normal-case">v4.8 GridView</span></h1>
                <p class="text-xs text-slate-500">HFT Replica Engine: <span id="uptime" class="text-slate-300">00:00:00</span></p>
            </div>
            <div id="status" class="px-3 py-1 rounded-full bg-green-900 text-green-400 text-xs border border-green-700">ONLINE</div>
        </header>

        <!-- Hlavní metriky -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-slate-800 p-4 rounded border border-slate-700">
                <h2 class="text-slate-400 text-[10px] uppercase mb-1">Cena BTC</h2>
                <div id="price" class="text-2xl font-bold text-white">---</div>
            </div>
            <div class="bg-slate-800 p-4 rounded border border-slate-700">
                <h2 class="text-slate-400 text-[10px] uppercase mb-1">Profit/Loss</h2>
                <div id="pnl" class="text-2xl font-bold">$0.00</div>
            </div>
            <div class="bg-slate-800 p-4 rounded border border-slate-700">
                <h2 class="text-slate-400 text-[10px] uppercase mb-1">Latence</h2>
                <div id="latency" class="text-2xl font-bold text-yellow-400">---</div>
            </div>
            <div class="bg-slate-800 p-4 rounded border border-slate-700">
                <h2 class="text-slate-400 text-[10px] uppercase mb-1">Pozice</h2>
                <div id="position" class="text-2xl font-bold text-blue-400">0.0000</div>
            </div>
        </div>

        <!-- Hlavní Graf s Gridem -->
        <div class="bg-slate-800 p-4 rounded border border-slate-700 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-slate-400 text-[10px] uppercase">Real-time Trading Grid</h2>
                <div class="flex space-x-4 text-[10px]">
                    <span class="flex items-center"><span class="w-2 h-2 bg-red-500 rounded-full mr-1"></span> ASKS</span>
                    <span class="flex items-center"><span class="w-2 h-2 bg-green-500 rounded-full mr-1"></span> BIDS</span>
                </div>
            </div>
            <div id="chart-grid" class="w-full"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-4 rounded border border-slate-700">
                <h2 class="text-slate-400 text-[10px] uppercase mb-4">PnL Křivka</h2>
                <div id="chart-pnl" class="w-full"></div>
            </div>
            <div class="bg-slate-800 p-4 rounded border border-slate-700">
                <h2 class="text-slate-400 text-[10px] uppercase mb-2">AI Risk Monitor</h2>
                <div id="log" class="text-[10px] text-slate-500 h-32 overflow-y-auto italic space-y-1">
                    <div>[SYSTEM] Inicializace GridView...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MAX_POINTS = 300;
        let dataStore = { ts: [], price: [], pnl: [] };
        let currentGrid = { base: 0, step: 0, size: 0 };

        function gridPlugin() {
            return {
                hooks: {
                    draw: (u) => {
                        if (currentGrid.base === 0) return;
                        let { ctx, bbox } = u;
                        ctx.save();
                        
                        // Kreslení gridových čar
                        for (let i = 1; i <= currentGrid.size; i++) {
                            // Asks (Red)
                            let yAsk = u.valToPos(currentGrid.base + (i * currentGrid.step), 'y');
                            ctx.strokeStyle = "rgba(239, 68, 68, 0.4)";
                            ctx.setLineDash([5, 5]);
                            ctx.beginPath();
                            ctx.moveTo(bbox.left, yAsk);
                            ctx.lineTo(bbox.left + bbox.width, yAsk);
                            ctx.stroke();

                            // Bids (Green)
                            let yBid = u.valToPos(currentGrid.base - (i * currentGrid.step), 'y');
                            ctx.strokeStyle = "rgba(34, 197, 94, 0.4)";
                            ctx.beginPath();
                            ctx.moveTo(bbox.left, yBid);
                            ctx.lineTo(bbox.left + bbox.width, yBid);
                            ctx.stroke();
                        }
                        ctx.restore();
                    }
                }
            };
        }

        let gridChartOpts = {
            width: document.getElementById("chart-grid").clientWidth - 20,
            height: 400,
            plugins: [gridPlugin()],
            scales: { x: { time: false }, y: { auto: true, range: (u, min, max) => [min - 50, max + 50] } },
            series: [ {}, { label: "Price", stroke: "#fff", width: 2 } ],
            axes: [ { stroke: "#64748b" }, { stroke: "#64748b", size: 80 } ]
        };

        let pnlChartOpts = {
            width: document.getElementById("chart-pnl").clientWidth - 20,
            height: 150,
            scales: { x: { time: false } },
            series: [ {}, { label: "PnL", stroke: "#22c55e", width: 2, fill: "rgba(34, 197, 94, 0.1)" } ],
            axes: [ { show: false }, { stroke: "#64748b", size: 60 } ]
        };

        let gridChart = new uPlot(gridChartOpts, [[], []], document.getElementById("chart-grid"));
        let pnlChart = new uPlot(pnlChartOpts, [[], []], document.getElementById("chart-pnl"));

        const ws = new WebSocket(`ws://${window.location.hostname}:3000/ws`);
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (!data || data.mid_price === undefined) return;
            
            // Součet pro celkové PnL
            const total_pnl = (data.realized_pnl || 0) + (data.unrealized_pnl || 0);

            document.getElementById('price').textContent = (data.mid_price || 0).toLocaleString('cs-CZ');
            document.getElementById('position').textContent = (data.position || 0).toFixed(5);
            document.getElementById('pnl').textContent = (total_pnl >= 0 ? '+' : '') + '$' + total_pnl.toFixed(2);
            document.getElementById('pnl').className = 'text-2xl font-bold ' + (total_pnl >= 0 ? 'positive' : 'negative');
            document.getElementById('latency').textContent = (data.latency_ms || 0).toFixed(3) + ' ms';
            document.getElementById('uptime').textContent = data.uptime_hms || "00:00:00";
            
            // Aktualizace gridu pro plugin
            currentGrid = { base: data.grid_base, step: data.grid_step, size: data.grid_size };

            // Data pro grafy
            dataStore.ts.push(dataStore.ts.length);
            dataStore.price.push(data.mid_price);
            dataStore.pnl.push(total_pnl);

            if (dataStore.ts.length > MAX_POINTS) {
                dataStore.ts.shift(); dataStore.price.shift(); dataStore.pnl.shift();
                dataStore.ts = dataStore.ts.map((_, i) => i);
            }

            gridChart.setData([dataStore.ts, dataStore.price]);
            pnlChart.setData([dataStore.ts, dataStore.pnl]);
        };

        window.addEventListener("resize", () => {
            gridChart.setSize({ width: document.getElementById("chart-grid").clientWidth - 20, height: 400 });
            pnlChart.setSize({ width: document.getElementById("chart-pnl").clientWidth - 20, height: 150 });
        });
    </script>
</body>
</html>
